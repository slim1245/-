<title>Мои смены</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#6b778c;--acc:#0f8b6d;--accbg:#dff3ec;--line:#dde3ea;--danger:#c0392b;--btn:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#18223a;--ink:#eaf0fa;--mute:#93a0b8;--acc:#3fd1a5;--accbg:#143a33;--line:#273352;--danger:#ff7b6b;--btn:#06211a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#18223a;--ink:#eaf0fa;--mute:#93a0b8;--acc:#3fd1a5;--accbg:#143a33;--line:#273352;--danger:#ff7b6b;--btn:#06211a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:0 0 110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:var(--btn);padding:14px 18px 14px;border-radius:0 0 22px 22px}
.top small{font-weight:600;font-size:13px;opacity:.85}
.top .big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:2px 0 6px}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;font-weight:600;opacity:.9}
.stats b{font-weight:800}
.pay{margin-top:10px;width:100%;padding:9px;border-radius:10px;border:1.5px solid currentColor;background:none;color:inherit;font-weight:800;font-size:13px}
.list{padding:6px 14px 0}
.mh{display:flex;justify-content:space-between;margin:18px 4px 6px;font-weight:800;font-size:14px;color:var(--mute)}
.sh{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.sh.paid{opacity:.55}
.sum{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.dt{width:44px;text-align:center;flex:none}
.dt b{display:block;font-size:22px;line-height:1}
.dt span{font-size:12px;color:var(--mute);font-weight:600}
.mid{flex:1;min-width:0;font-size:13px;color:var(--mute);line-height:1.45}
.mid b{color:var(--ink)}
.net{font-weight:800;font-size:18px;color:var(--acc);white-space:nowrap}
.det{display:none;padding:0 14px 12px;border-top:1px dashed var(--line);font-size:14px}
.sh.open .det{display:block}
.ln{display:flex;justify-content:space-between;padding:5px 0;color:var(--mute)}
.ln b{color:var(--ink)}
.ln em{font-style:normal;color:var(--danger);font-weight:800}
.acts{display:flex;gap:8px;margin-top:6px}
.mini{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.mini.del{color:var(--danger);margin-left:auto}
.paidtog{display:block;margin:16px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-weight:600;font-size:14px;padding:8px;cursor:pointer}
.empty{white-space:pre-line;color:var(--mute);text-align:center;padding:40px 20px;font-size:15px;line-height:1.5}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--btn);border:0;border-radius:999px;padding:16px 22px;font:inherit;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.set{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:26px;color:var(--mute);font-size:14px}
.set input{width:70px;font-size:15px;padding:7px 10px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{border:0;background:none;color:var(--mute);font-size:26px;cursor:pointer}
label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin:12px 0 6px}
input{width:100%;font:inherit;font-size:17px;font-weight:600;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addx{display:grid;grid-template-columns:1fr 90px auto;gap:8px}
.addx input{font-size:15px;padding:10px}
.addx button{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:0 12px;font-weight:800;font-size:14px;cursor:pointer}
.chip{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chip em{font-style:normal;color:var(--danger);font-weight:800}
.chip button{border:0;background:none;color:var(--mute);font-size:18px;padding:0 4px 0 10px;cursor:pointer}
.calc{margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--accbg);display:flex;justify-content:space-between;align-items:center;gap:8px}
.calc span{color:var(--mute);font-size:14px;font-weight:600}
.calc b{font-size:20px;color:var(--acc);font-weight:800}
.save{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:var(--acc);color:var(--btn);font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <div class="top">
    <small>Предварительная зарплата</small>
    <div class="big" id="mtotal">0 ₽</div>
    <div class="stats" id="stats"></div>
    <button class="pay" id="payout">Получила зарплату — начать новый период</button>
  </div>
  <div class="list" id="list"></div>
  <div class="set"><span>Процент от кассы:</span><input id="rate" type="text" inputmode="decimal"><span>%</span></div>
</main>
<button class="fab" id="fab">+ Смена</button>
<div class="toast" id="toast"></div>

<div class="ov" id="ov">
  <div class="sheet">
    <h2><span id="stitle">Новая смена</span><button id="close" aria-label="Закрыть">×</button></h2>
    <label for="date">Дата</label>
    <input id="date" type="date">
    <label for="sum">Сдала кассы, ₽</label>
    <input id="sum" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
    <div class="two">
      <div><label for="tips">Чаевых всего, ₽</label><input id="tips" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
      <div><label for="home">Забрала домой, ₽</label><input id="home" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
    </div>
    <label>Траты в счёт зарплаты (кухня, еда)</label>
    <div class="addx">
      <input id="xn" type="text" placeholder="Например, пицца" autocomplete="off">
      <input id="xa" type="text" inputmode="decimal" placeholder="₽" autocomplete="off">
      <button id="xadd">Добавить</button>
    </div>
    <div id="xlist"></div>
    <div class="calc"><span id="plabel">Ваши 5%</span><b id="pay5">0 ₽</b></div>
    <div class="calc" style="margin-top:8px"><span>В зарплату за смену</span><b id="net">0 ₽</b></div>
    <button class="save" id="save">Сохранить смену</button>
  </div>
</div>

<script>
(function(){
  var KEY="shifts_v1", RKEY="rate_v1";
  var shifts=[], rate=5, draft=[], editId=null, showPaid=false;
  try{ shifts=JSON.parse(localStorage.getItem(KEY)||"[]")||[]; }catch(e){ shifts=[]; }
  try{ var r=parseFloat(localStorage.getItem(RKEY)); if(r>0) rate=r; }catch(e){}
  shifts.forEach(function(s){ s.tips=s.tips||0; s.home=s.home||0; s.exp=s.exp||[]; s.paid=!!s.paid; });

  var $=function(id){return document.getElementById(id)};
  var fmt=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
  var money=function(n){return fmt.format(Math.round(n*100)/100)+" ₽"};
  var num=function(s){return parseFloat(String(s).replace(/\s/g,"").replace(",","."))||0};
  var months=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  var monthsS=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function persist(){ try{localStorage.setItem(KEY,JSON.stringify(shifts));localStorage.setItem(RKEY,String(rate));}catch(e){} }
  function toast(t){var e=$("toast");e.textContent=t;e.className="toast on";setTimeout(function(){e.className="toast"},1900)}
  function expSum(a){return a.reduce(function(t,x){return t+x.amount},0)}
  function net(s){return s.sum*s.rate/100-expSum(s.exp)}

  function preview(){
    var p=num($("sum").value)*rate/100;
    $("plabel").textContent="Ваши "+fmt.format(rate)+"%";
    $("pay5").textContent=money(p);
    $("net").textContent=money(p-expSum(draft));
  }
  function drawDraft(){
    var b=$("xlist");b.innerHTML="";
    draft.forEach(function(x,i){
      var c=el("div","chip");c.appendChild(el("span",null,x.name));
      var r=el("span");r.appendChild(el("em",null,"−"+money(x.amount)));
      var d=el("button",null,"×");d.setAttribute("aria-label","Убрать");d.onclick=function(){draft.splice(i,1);drawDraft()};
      r.appendChild(d);c.appendChild(r);b.appendChild(c);
    });
    preview();
  }
  function openSheet(s){
    editId=s?s.id:null;
    $("stitle").textContent=s?"Изменить смену":"Новая смена";
    $("date").value=s?s.date:today();
    $("sum").value=s?String(s.sum).replace(".",","):"";
    $("tips").value=s&&s.tips?String(s.tips):"";
    $("home").value=s&&s.home?String(s.home):"";
    $("xn").value="";$("xa").value="";
    draft=s?s.exp.map(function(x){return {name:x.name,amount:x.amount}}):[];
    drawDraft();$("ov").className="ov on";
    if(!s)setTimeout(function(){$("sum").focus()},50);
  }
  function closeSheet(){$("ov").className="ov"}

  function shiftNode(s){
    var d=s.date.split("-");
    var c=el("div","sh"+(s.paid?" paid":""));
    var sm=el("div","sum");
    var dt=el("div","dt");dt.appendChild(el("b",null,String(+d[2])));dt.appendChild(el("span",null,monthsS[+d[1]-1]));
    var mid=el("div","mid");
    var l1=el("div");l1.appendChild(document.createTextNode("Касса "));l1.appendChild(el("b",null,money(s.sum)));
    l1.appendChild(document.createTextNode(" · "+fmt.format(s.rate)+"% = "));l1.appendChild(el("b",null,money(s.sum*s.rate/100)));
    mid.appendChild(l1);
    var bits=[];
    if(s.tips)bits.push("чай "+money(s.tips)+(s.home!==s.tips?" (домой "+money(s.home)+")":""));
    if(s.exp.length)bits.push("траты −"+money(expSum(s.exp)));
    if(s.paid)bits.push("выплачено");
    if(bits.length)mid.appendChild(el("div",null,bits.join(" · ")));
    sm.appendChild(dt);sm.appendChild(mid);sm.appendChild(el("div","net",money(net(s))));
    sm.onclick=function(){c.classList.toggle("open")};
    c.appendChild(sm);
    var det=el("div","det");
    function line(a,b){var x=el("div","ln");x.appendChild(el("span",null,a));x.appendChild(el("b",null,b));det.appendChild(x)}
    line("Чаевых всего",money(s.tips));
    line("Забрала домой",money(s.home));
    if(s.tips-s.home>0)line("Потрачено на смене",money(s.tips-s.home));
    s.exp.forEach(function(x){var r=el("div","ln");r.appendChild(el("span",null,x.name));r.appendChild(el("em",null,"−"+money(x.amount)));det.appendChild(r)});
    var acts=el("div","acts");
    if(!s.paid){var ed=el("button","mini","Изменить");ed.onclick=function(){openSheet(s)};acts.appendChild(ed);}
    var del=el("button","mini del","Удалить");
    del.onclick=function(){if(confirm("Удалить смену за "+(+d[2])+" "+monthsS[+d[1]-1]+"?")){shifts=shifts.filter(function(z){return z.id!==s.id});persist();render();toast("Смена удалена");}};
    acts.appendChild(del);det.appendChild(acts);c.appendChild(det);
    return c;
  }
  function group(box,arr){
    var cur=null,mt=0,hdr=null;
    function fin(){if(hdr)hdr.lastChild.textContent=money(mt)}
    arr.forEach(function(s){
      var k=s.date.slice(0,7);
      if(k!==cur){fin();cur=k;mt=0;var p=k.split("-");var nm=months[+p[1]-1];
        hdr=el("div","mh");hdr.appendChild(el("span",null,nm[0].toUpperCase()+nm.slice(1)+" "+p[0]));hdr.appendChild(el("span",null,""));box.appendChild(hdr);}
      mt+=net(s);box.appendChild(shiftNode(s));
    });
    fin();
  }

  function render(){
    var un=shifts.filter(function(s){return !s.paid}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
    var pd=shifts.filter(function(s){return s.paid}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
    var earn=0,exp=0,home=0;
    un.forEach(function(s){earn+=s.sum*s.rate/100;exp+=expSum(s.exp);home+=s.home});
    $("mtotal").textContent=money(earn-exp);
    var st=$("stats");st.innerHTML="";
    [["Смен",un.length],["Заработано",money(earn)],["Траты −",money(exp)],["Чай домой",money(home)]].forEach(function(a){
      var s=el("span",null,a[0]+": ");s.appendChild(el("b",null,String(a[1])));st.appendChild(s);
    });
    $("payout").style.display=un.length?"block":"none";
    var box=$("list");box.innerHTML="";
    if(!un.length)box.appendChild(el("div","empty","В этом периоде смен пока нет.\nНажмите «+ Смена», чтобы добавить первую."));
    group(box,un);
    if(pd.length){
      var t=el("button","paidtog",(showPaid?"Скрыть":"Показать")+" выплаченные смены ("+pd.length+")");
      t.onclick=function(){showPaid=!showPaid;render()};box.appendChild(t);
      if(showPaid)group(box,pd);
    }
  }

  $("rate").value=String(rate).replace(".",",");
  $("rate").addEventListener("input",function(){var v=num($("rate").value);if(v>0&&v<=100){rate=v;persist();preview();}});
  $("sum").addEventListener("input",preview);
  $("fab").onclick=function(){openSheet(null)};
  $("close").onclick=closeSheet;
  $("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeSheet()});
  $("xadd").addEventListener("click",function(){
    var n=$("xn").value.trim(),a=num($("xa").value);
    if(!n||!(a>0)){toast("Введите название и сумму");return;}
    draft.push({name:n.slice(0,60),amount:a});$("xn").value="";$("xa").value="";drawDraft();
  });
  $("save").addEventListener("click",function(){
    var s=num($("sum").value);
    if(!(s>0)){toast("Введите сумму кассы");$("sum").focus();return;}
    if(!$("date").value){toast("Выберите дату");return;}
    var t=num($("tips").value),h=num($("home").value);
    if(h>t)t=h;
    if(editId){
      var o=shifts.filter(function(z){return z.id===editId})[0];
      if(o){o.date=$("date").value;o.sum=s;o.tips=t;o.home=h;o.exp=draft.slice();}
    }else{
      shifts.push({id:Date.now(),date:$("date").value,sum:s,rate:rate,tips:t,home:h,exp:draft.slice(),paid:false});
    }
    persist();closeSheet();render();toast("Смена сохранена");
  });
  $("payout").addEventListener("click",function(){
    var un=shifts.filter(function(s){return !s.paid});
    var t=0;un.forEach(function(s){t+=net(s)});
    if(confirm("Отметить все смены как выплаченные ("+money(t)+") и начать новый период?")){
      un.forEach(function(s){s.paid=true});persist();render();toast("Новый период начат");
    }
  });
  render();
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');}catch(e){}
})();
</script>
</body>
</html>
